[project]
name = "webui"
version = "0.1.0"
description = "Mattermost broadcast web interface"
requires-python = ">=3.14"
dependencies = [
    "django>=4.2",
    "requests>=2.33",
    "gunicorn>=22.0",
    "python-dotenv>=1.0",
    "whitenoise>=6.0",
    "mozilla-django-oidc>=5.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-cov>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "webui.settings_test"
