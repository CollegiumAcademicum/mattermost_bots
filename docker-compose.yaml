services:
  postbot:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./.env:/app/.env:ro
      - ./data/postbot:/app/data
    networks:
      - internal
    restart: unless-stopped

  webui:
    build:
      context: ./webui
      dockerfile: Dockerfile
    environment:
      - DJANGO_SECRET_KEY
      - ALLOWED_HOSTS
      - LDAP_SERVER_URI
      - LDAP_BIND_DN
      - LDAP_BIND_PASSWORD
      - LDAP_USER_SEARCH_BASE
      - LDAP_ADMIN_GROUP_DN
      - LDAP_CA_CERT_PATH
      - POSTBOT_API_URL=http://postbot:8000
      - POSTBOT_API_SECRET=${WEBUI_API_SECRET}
    ports:
      - "8080:8080"
    networks:
      - internal
    depends_on:
      - postbot
    volumes:
      - ./data/webui:/app/data
      - ./data/certs:/app/certs:ro
    restart: unless-stopped

networks:
  internal:
    driver: bridge
